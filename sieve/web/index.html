<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>用正弦乘积筛质数 · Prime Sieve by Sines</title>
<style>
  :root{
    --bg:#070a12; --panel:rgba(10,16,26,.82); --line:rgba(255,255,255,.12);
    --fg:#dfe9f3; --dim:#8fa6bd; --cyan:#39e0f0; --green:#6ee7a8;
    --orange:#ff9a3c; --red:#ff5c5c; --gray:#4a5568;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased}
  header{padding:22px 20px 6px;max-width:1180px;margin:0 auto}
  h1{margin:0;font-size:20px;font-weight:600;letter-spacing:.02em}
  .sub{color:var(--dim);font-size:12.5px;margin-top:6px;line-height:1.6}
  .formula{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--cyan);
    font-size:13.5px;margin-top:8px}
  main{max-width:1180px;margin:0 auto;padding:14px 20px 40px;display:grid;
    grid-template-columns:1fr 268px;gap:16px}
  @media (max-width:820px){ main{grid-template-columns:1fr} }
  .stage{position:relative;background:#050810;border:1px solid var(--line);border-radius:12px;
    overflow:hidden}
  canvas{display:block;width:100%;height:auto}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 15px;
    backdrop-filter:blur(3px);align-self:start}
  .panel h2{font-size:12px;font-weight:600;color:#a8c6e0;margin:0 0 10px;letter-spacing:.08em;
    text-transform:uppercase}
  .ctl{margin-bottom:14px}
  .ctl label{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:6px}
  .ctl label b{color:var(--fg);font-variant-numeric:tabular-nums;font-weight:600}
  .cap{display:block;color:#ff8f8f;font-size:11.5px;font-variant-numeric:tabular-nums;margin-top:5px}
  input[type=range]{width:100%;-webkit-appearance:none;height:4px;border-radius:2px;
    background:rgba(255,255,255,.14);outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;
    border-radius:50%;background:var(--cyan);cursor:pointer;box-shadow:0 0 0 3px rgba(57,224,240,.18)}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border:none;border-radius:50%;
    background:var(--cyan);cursor:pointer}
  .stats{font-size:12px;line-height:1.9;color:#a8c6e0;font-variant-numeric:tabular-nums}
  .stats b{color:var(--green);font-weight:600}
  .stats .warn{color:var(--orange)}
  .hr{height:1px;background:rgba(255,255,255,.1);margin:12px 0}
  .legend{font-size:11.5px;line-height:1.9;color:var(--dim)}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;
    vertical-align:1px}
  .hint{font-size:11px;color:#6b7f94;line-height:1.6;margin-top:10px}
  .langs{position:fixed;top:12px;right:16px;z-index:20}
  .langs button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);
    color:#999;padding:4px 10px;margin-left:4px;border-radius:4px;cursor:pointer;font-size:12px}
  .langs button.active{color:#fff;border-color:#66aaff;background:rgba(102,170,255,.15)}
</style>
</head>
<body>

<div class="langs">
  <button data-lang="zh">中文</button>
  <button data-lang="en">English</button>
  <button data-lang="ja">日本語</button>
</div>

<header>
  <h1 data-t="title">用正弦乘积筛质数</h1>
  <p class="sub" data-t="sub">每一个 sin(πx/p) 的零点都落在 p 的倍数上。把前 n 个质数的正弦乘起来，零点的集合就是"能被这些小质数整除的数"。剩下不为零的地方，就是质数。</p>
  <p class="formula">f(x) = sin(πx/2) · sin(πx/3) · sin(πx/5) · … · sin(πx/p<sub>n</sub>)</p>
</header>

<main>
  <div class="stage">
    <canvas id="cv"></canvas>
  </div>

  <aside class="panel">
    <h2 data-t="controls">参数</h2>

    <div class="ctl">
      <label><span data-t="primeCount">参与相乘的质数个数</span><b id="vN">10</b></label>
      <input type="range" id="sN" min="1" max="45" value="10" step="1">
      <span class="cap" id="vBound"></span>
    </div>

    <div class="ctl">
      <label><span data-t="xRange">横轴范围</span><b id="vX">70</b></label>
      <input type="range" id="sX" min="10" max="200" value="70" step="1">
    </div>

    <div class="ctl">
      <label><span data-t="ygain">纵向增益</span><b id="vY">1.0×</b></label>
      <input type="range" id="sY" min="10" max="300" value="100" step="5">
    </div>

    <div class="hr"></div>

    <div class="stats" id="stats"></div>

    <div class="hr"></div>

    <div class="legend">
      <div><i style="background:var(--gray)"></i><span data-t="lgInvalid">无效区 x ≤ p：质数被自己筛掉</span></div>
      <div><i style="background:var(--cyan)"></i><span data-t="lgValid">有效区 p &lt; x ≤ p²：这里才分得出质数</span></div>
      <div><i style="background:var(--red)"></i><span data-t="lgOver">超界区 x &gt; p²：只能判 n-粗糙数</span></div>
      <div><i style="background:var(--orange)"></i><span data-t="lgUsed">已参与相乘的质数</span></div>
      <div><i style="background:var(--red)"></i><span data-t="lgUnused">视野内但没参与相乘的质数</span></div>
      <div><i style="background:var(--green)"></i><span data-t="lgDetected">被曲线判定出来的质数</span></div>
    </div>

    <p class="hint" data-t="hint">把「质数个数」往下拉，可判上限 p² 会跟着往左移；在有效区里，曲线不为零的位置正好是质数。</p>
  </aside>
</main>

<script src="sieve.js"></script>
</body>
</html>
